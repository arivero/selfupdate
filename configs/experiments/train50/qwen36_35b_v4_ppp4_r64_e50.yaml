# Qwen3.6-35B-A3B r64 arm of the complete-decoder-matrix LoRA campaign.
# Identical to campaign50_q35b_ppp4 (huber, e50) except LoRA rank 16 -> 64.
# 35B-A3B is MoE (256 experts top-8), so expert_parameters: true is required
# to cover the packed banks -- the point where memorization lands (owner).
# CAVEAT: MoE r64 carries the same unexplained SP-vs-shard numerics
# discrepancy the A4B r64 gate flagged (see issues.md); the ungated store
# path does not re-check it. Results are labelled accordingly.
run_name: campaign50_q35b_ppp4_r64
mask:
  compaction: flow_mask
cache:
  store_full_teacher_inputs: false
train:
  pipeline_version: 4
  pipeline_revision: "4.6"
  batching: bucketed
  epochs: 50
  seed: 17
  hidden_loss: huber
  lora: {enabled: true, r: 64, alpha: 128, dropout: 0.0, expert_parameters: true}
  v4_teacher_source: store
  v4_loop_order: layer_major
  v4_relay_every_cohorts: 3
  v4_stage_scoped: true
  v4_weight_residency: auto
  v4_stage_splits: [10, 20, 30]
  v4_stage_devices: [0, 1, 2, 3]
  v4_optimizer: immediate_sgd
  lr: 3.0e-6
eval:
  every_epochs: 5
  recall_corpora: [machado, quijote_ch1, quijote_ch4]
  standard_damage_every_epochs: 5
