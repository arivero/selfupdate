# Qwen-27B r64 2x2 'not-learning' screen — LR arm.
# Same as campaign50_q27b_ppp4_r64 (huber@3e-6, done) but lr 10x.
# Tests whether flat student_argmax is under-training (immediate_sgd 3e-6 is very low).
run_name: campaign50_q27b_ppp4_r64_lr3e5
mask:
  compaction: flow_mask
cache:
  store_full_teacher_inputs: false
train:
  pipeline_version: 4
  pipeline_revision: "4.6"
  batching: bucketed
  micro_batch: 16
  epochs: 50
  seed: 17
  hidden_loss: huber
  lora: {enabled: true, r: 64, alpha: 128, dropout: 0.0, expert_parameters: false}
  v4_teacher_source: store
  v4_loop_order: layer_major
  v4_relay_every_cohorts: 3
  v4_stage_scoped: true
  v4_weight_residency: auto
  v4_stage_splits: [16, 32, 48]
  v4_stage_devices: [0, 1, 2, 3]
  v4_optimizer: immediate_sgd
  lr: 3.0e-5
eval:
  every_epochs: 5
  recall_corpora: [machado, quijote_ch1, quijote_ch4]
  standard_damage_every_epochs: 5
