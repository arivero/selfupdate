# r64 arm — mirrors the r16 qwen36_35b_v4_ppp4_cosine_e50 config, LoRA rank 16 -> 64.
# MoE: expert_parameters true (carries the open A4B-r64 numerics caveat, see issues.md). Ungated qwen_ppp4_50 store path, controlled r16-vs-r64 comparison.
run_name: campaign50_q35b_ppp4_cosine_r64
mask: {compaction: flow_mask}
cache: {store_full_teacher_inputs: false}
train:
  pipeline_version: 4
  pipeline_revision: "4.6"
  batching: bucketed
  hidden_loss: cosine
  lora: {enabled: true, r: 64, alpha: 128, dropout: 0.0, expert_parameters: true}
  epochs: 50
  seed: 17
  v4_teacher_source: store
  v4_loop_order: layer_major
  v4_relay_every_cohorts: 3
  v4_stage_scoped: true
  v4_weight_residency: auto
  v4_stage_splits: [10, 20, 30]
  v4_stage_devices: [0, 1, 2, 3]
  v4_optimizer: immediate_sgd
  lr: 3.0e-6
eval:
  every_epochs: 5
  recall_corpora: [machado, quijote_ch1, quijote_ch4]
  standard_damage_every_epochs: 5
